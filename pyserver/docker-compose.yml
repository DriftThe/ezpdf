# ezpdf parse service: one config for both variants; pick one with a profile
#   docker compose --profile cpu up -d      # CPU image (small, runs anywhere)
#   docker compose --profile gpu up -d      # GPU image (host needs nvidia-container-toolkit)
# After start, read the auth token from the logs and paste it into App → Settings → OCR service.
services:
  ezpdf-pyserver-cpu:
    build:
      context: .
      args:
        VARIANT: cpu
        # All four empty = official sources; override in .env or the environment when slow/blocked (see README "Deploy with Docker")
        BASE_IMAGE: ${BASE_IMAGE:-python:3.12-slim}
        APT_MIRROR: ${APT_MIRROR:-}
        PIP_INDEX: ${PIP_INDEX:-}
        TORCH_INDEX: ${TORCH_INDEX:-}
    image: ezpdf-pyserver:cpu
    profiles: ["cpu"]
    # Binds localhost only; use "9055:9055" for LAN/public (plain HTTP — put an HTTPS proxy in front)
    ports:
      - "127.0.0.1:9055:9055"
    volumes:
      # Models are baked into the image; this only persists token.txt (container rebuilds keep the token)
      - ./data:/data

  ezpdf-pyserver-gpu:
    build:
      context: .
      args:
        VARIANT: gpu
        BASE_IMAGE: ${BASE_IMAGE:-python:3.12-slim}
        APT_MIRROR: ${APT_MIRROR:-}
        PIP_INDEX: ${PIP_INDEX:-}
        # For the GPU variant use .../pytorch-wheels/cu132
        TORCH_INDEX: ${TORCH_INDEX:-}
    image: ezpdf-pyserver:gpu
    profiles: ["gpu"]
    ports:
      - "127.0.0.1:9055:9055"
    volumes:
      - ./data:/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
