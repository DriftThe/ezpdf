name: Release

# A v<version> tag (matching src-tauri/tauri.conf.json) builds Windows + Linux (deb/rpm)
# installers into a draft Release (smoke test, then publish); workflow_dispatch also works.
# The in-app update check reads GitHub's latest release, so drafts/prereleases are invisible.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Tag must equal tauri.conf.json's version; tag drift silently breaks the update check
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches app version
        if: github.event_name == 'push'
        run: |
          APP_VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "${{ github.ref_name }}" != "v${APP_VERSION}" ]; then
            echo "::error::tag ${{ github.ref_name }} != v${APP_VERSION} (src-tauri/tauri.conf.json)"
            exit 1
          fi

  build:
    needs: check-version
    strategy:
      fail-fast: false # one platform's failure must not drop the other's artifacts
      matrix:
        include:
          - platform: windows-latest
            args: --bundles nsis
          - platform: ubuntu-22.04
            args: --bundles deb,rpm # overrides tauri.conf targets:["nsis"] (the Windows default)
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Tauri v2 Linux build deps (webkit2gtk-4.1 is the v2 runtime)
      - name: Linux build dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            patchelf \
            libayatana-appindicator3-dev \
            xdg-utils

      - run: pnpm install --frozen-lockfile

      # tauri build runs beforeBuildCommand (pnpm build + pack-runtime.mjs) itself:
      # vue-tsc typecheck -> vite build -> bundled Python/pyserver/prompts -> LTO release -> package
      # (pack-runtime.mjs picks the python-build-standalone asset for the runner; mirror chain ~50MB)
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: ezpdf v__VERSION__
          releaseBody: |
            Windows 下载 setup.exe 安装；Linux 用 deb/rpm 包（Debian/Ubuntu 用 deb，Fedora/RHEL 用 rpm）。
            首次运行后在应用内「一键安装服务」下载 OCR 依赖与模型。

            解析服务的离线镜像快照（自包含、模型内置，供离线/公网隔离服务器用）单独发布在
            `pyserver-v<版本>` 这个 Release 下（由 **Pyserver images** workflow 手动构建），
            与应用安装包分开，下载方式见 README「用 Docker 部署解析服务」。

            详细发布说明见仓库 `docs/release-notes/`（由下面的 notes 作业自动套用）。
          releaseDraft: true
          prerelease: false
          tauriScript: pnpm tauri
          uploadUpdaterJson: false # no Tauri updater plugin (the app polls GitHub Releases)
          args: ${{ matrix.args }}

  # Release notes always come from docs/release-notes/v<version>.md (bilingual, tag-tracked),
  # applied after the matrix; tauri-action's releaseBody is only a fallback.
  notes:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply docs/release-notes/<tag>.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ github.ref_name }}"
          if [ -z "$tag" ] || [ "${tag#v}" = "$tag" ]; then
            version=$(node -p "require('./src-tauri/tauri.conf.json').version")
            tag="v${version}"
          fi
          file="docs/release-notes/${tag}.md"
          if [ ! -f "$file" ]; then
            echo "no release notes at $file, keeping the workflow body"
            exit 0
          fi
          gh release edit "$tag" --notes-file "$file"
          echo "applied $file to release $tag"
