name: Release

# 打 tag（v<version>，须与 src-tauri/tauri.conf.json 的 version 一致）即出一版
# Windows 安装包 + Linux 包（deb/rpm）并建 draft Release（人工冒烟后转正）；
# 也可手动 workflow_dispatch。应用内「检查更新」查的是 GitHub 的 latest release，
# draft/预发布不会被看到。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # tag 必须等于 tauri.conf.json 的 version：tag 漂移会让更新检查静默错版
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches app version
        if: github.event_name == 'push'
        run: |
          APP_VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "${{ github.ref_name }}" != "v${APP_VERSION}" ]; then
            echo "::error::tag ${{ github.ref_name }} != v${APP_VERSION} (src-tauri/tauri.conf.json)"
            exit 1
          fi

  build:
    needs: check-version
    strategy:
      fail-fast: false # 一个平台失败不影响另一个平台产物
      matrix:
        include:
          - platform: windows-latest
            args: --bundles nsis
          - platform: ubuntu-22.04
            args: --bundles deb,rpm # 覆盖 tauri.conf 的 targets:["nsis"]（那是 Windows 默认）
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Tauri v2 的 Linux 构建依赖（webkit2gtk-4.1 是 v2 的运行时）
      - name: Linux build dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            patchelf \
            libayatana-appindicator3-dev \
            xdg-utils

      - run: pnpm install --frozen-lockfile

      # beforeBuildCommand（pnpm build + pack-runtime.mjs）由 tauri build 自动执行：
      # vue-tsc 类型检查 → vite build → 随包 Python/pyserver/提示词 → LTO release → 各平台打包
      # （pack-runtime.mjs 按 runner 平台挑 python-build-standalone 资产，镜像链现下 ~50MB）
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: ezpdf v__VERSION__
          releaseBody: |
            Windows 下载 setup.exe 安装；Linux 用 deb/rpm 包（Debian/Ubuntu 用 deb，Fedora/RHEL 用 rpm）。
            首次运行后在应用内「一键安装服务」下载 OCR 依赖与模型。

            解析服务的离线镜像快照（自包含、模型内置，供离线/公网隔离服务器用）单独发布在
            `pyserver-v<版本>` 这个 Release 下（由 **Pyserver images** workflow 手动构建），
            与应用安装包分开，下载方式见 README「用 Docker 部署解析服务」。

            详细发布说明见仓库 `docs/release-notes/`（由下面的 notes 作业自动套用）。
          releaseDraft: true
          prerelease: false
          tauriScript: pnpm tauri
          uploadUpdaterJson: false # 未用 Tauri updater 插件（应用自查 GitHub Releases）
          args: ${{ matrix.args }}

  # 发布说明：正文一律取仓库里的 docs/release-notes/v<版本>.md（双语、随 tag 走），
  # 由矩阵跑完后统一套用——tauri-action 的 releaseBody 只是兜底短文。
  notes:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply docs/release-notes/<tag>.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ github.ref_name }}"
          if [ -z "$tag" ] || [ "${tag#v}" = "$tag" ]; then
            version=$(node -p "require('./src-tauri/tauri.conf.json').version")
            tag="v${version}"
          fi
          file="docs/release-notes/${tag}.md"
          if [ ! -f "$file" ]; then
            echo "no release notes at $file, keeping the workflow body"
            exit 0
          fi
          gh release edit "$tag" --notes-file "$file"
          echo "applied $file to release $tag"
