name: Pyserver images

# Pyserver image snapshots: build self-contained CPU/GPU images (models baked in, offline-ready),
# smoke test them, docker save, split under 2 GiB, upload to a `pyserver-<app tag>` Release kept
# separate from the app release (6.5 GB of assets would bloat it). Manual dispatch because a run
# downloads models (1.9 GB) + torch wheels and takes 20-30 min per variant; parts because a Release
# asset is capped at 2 GiB while the tar is 2.1GB (CPU) / 4.5GB (GPU). Draft first, publish manually.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 构建源的 tag（留空 = 用 tauri.conf.json 里的版本）；镜像会传到 pyserver-<tag>
        required: false
      variants:
        description: 构建哪些变体
        type: choice
        options: ["cpu,gpu", "cpu", "gpu"]
        default: "cpu,gpu"

permissions:
  contents: write

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need the tag; the build must match the published version

      - name: Resolve tag
        id: vars
        run: |
          set -euo pipefail
          tag="${{ inputs.tag }}"
          if [ -z "$tag" ]; then
            tag="v$(node -p "require('./src-tauri/tauri.conf.json').version")"
          fi
          if ! git rev-parse --verify "refs/tags/$tag" >/dev/null 2>&1; then
            echo "::error::tag $tag not found in this repository"
            exit 1
          fi
          git checkout --quiet "refs/tags/$tag"
          app_version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "$tag" != "v${app_version}" ]; then
            echo "::error::tag $tag != v${app_version} (src-tauri/tauri.conf.json)"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release=pyserver-${tag}" >> "$GITHUB_OUTPUT"
          echo "building from $(git rev-parse --short HEAD)"
          df -h / | tail -1

      # Separate pyserver-<tag> draft release, published manually; --verify-tag is omitted so a
      # dispatch does not need the release tag to exist yet. The body is the bilingual text below.
      - name: Ensure pyserver draft release
        run: |
          set -euo pipefail
          tag="${{ steps.vars.outputs.tag }}"
          rel="${{ steps.vars.outputs.release }}"
          if gh release view "$rel" >/dev/null 2>&1; then
            echo "release $rel already exists"
            exit 0
          fi
          cat > /tmp/notes.md <<EOF
          解析服务（pyserver）的自包含镜像快照，对应应用版本 \`$tag\`；与应用安装包分开发布。

          - \`ezpdf-pyserver-$tag-cpu.tar.part-*\` — CPU 镜像（模型内置），约 2.1GB，分 2 片
          - \`ezpdf-pyserver-$tag-gpu.tar.part-*\` — GPU 镜像（CUDA 版 torch + triton，模型内置），约 4.5GB，分 3 片
          - \`ezpdf-pyserver-$tag-<变体>.tar.sha256\` — 合并后的 tar 校验值

          分片是因为单个 Release 附件上限 2GiB。合并分片（Linux \`cat\` / Windows \`copy /b\`）→ 核对 sha256
          → \`docker load\` → \`docker run -p 127.0.0.1:9055:9055 -v ./data:/data ezpdf-pyserver:cpu\`（GPU 变体加
          \`--gpus all\`），启动日志里会打印访问令牌，填到应用「设置 → OCR 服务 → 在线服务」即可。镜像自包含，
          容器启动即可推理，不需要挂载卷、也不依赖联网；完整说明见仓库 README「用 Docker 部署解析服务」。

          Self-contained pyserver image snapshots for app $tag, published separately from the
          application installers. Concatenate the parts (Linux cat, Windows copy /b), verify the
          sha256, then docker load and run it (add --gpus all for the GPU variant); the access token
          is printed on every start and goes into Settings - OCR service. The models are baked in -
          no volume and no network needed. See the README section on running the parse service with
          Docker.
          EOF
          if git rev-parse --verify "refs/tags/$rel" >/dev/null 2>&1; then
            gh release create "$rel" --draft --title "ezpdf pyserver $tag" --notes-file /tmp/notes.md
          else
            gh release create "$rel" --draft --target "$(git rev-parse HEAD)" \
              --title "ezpdf pyserver $tag" --notes-file /tmp/notes.md
          fi
          echo "created draft release $rel"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The Dockerfile COPYs models in, so fetch them into the build context here via the app's own install path
      - name: Download models into the build context
        working-directory: pyserver
        env:
          HF_ENDPOINT: https://huggingface.co # fetch.py's default mirror; direct official is faster on the runner
          EZPDF_MODELS_DIR: ${{ github.workspace }}/pyserver/models
        run: |
          set -euo pipefail
          pip install -r requirements-download.txt
          python -m app.fetch
          du -sh "$EZPDF_MODELS_DIR"/*

      - name: Build CPU image
        if: contains(inputs.variants, 'cpu')
        run: |
          docker build -t ezpdf-pyserver:cpu -t "ezpdf-pyserver:${{ steps.vars.outputs.tag }}-cpu" \
            --build-arg VARIANT=cpu pyserver

      # /health alone is not enough: run real inference. No token must 403, with token 200.
      - name: Smoke test CPU image
        if: contains(inputs.variants, 'cpu')
        run: |
          set -euo pipefail
          trap 'docker rm -f smoke' EXIT # don't leave the container on the runner after a failure
          docker run -d --name smoke -p 127.0.0.1:9055:9055 \
            -v "$PWD/ci-data:/data" \
            -v "$PWD/scripts/smoke-inference.py:/smoke.py:ro" \
            ezpdf-pyserver:cpu
          code=""
          for _ in $(seq 1 40); do
            sleep 3
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:9055/health || true)
            [ "$code" = "403" ] && break
          done
          if [ "$code" != "403" ]; then
            echo "::error::unauthenticated /health returned $code"
            docker logs smoke
            exit 1
          fi
          # Read the token inside the container: /data/token.txt is root-owned mode 0600, unreadable by the runner
          docker exec smoke sh -c 'test -s /data/token.txt'
          TOKEN=$(docker exec smoke cat /data/token.txt)
          [ -n "$TOKEN" ] || {
            echo "::error::empty token file"
            docker logs smoke
            exit 1
          }
          curl -fsS -H "x-ezpdf-token: $TOKEN" http://127.0.0.1:9055/health
          docker exec smoke python /smoke.py

      - name: Package and upload CPU snapshot
        if: contains(inputs.variants, 'cpu')
        run: bash scripts/docker-snapshot.sh cpu "${{ steps.vars.outputs.tag }}" "${{ steps.vars.outputs.release }}"

      # The GPU image is an order of magnitude larger; drop the CPU image and parts to free disk
      - name: Free disk before the GPU build
        if: contains(inputs.variants, 'cpu') && contains(inputs.variants, 'gpu')
        run: |
          set -euo pipefail
          docker rmi "ezpdf-pyserver:cpu" "ezpdf-pyserver:${{ steps.vars.outputs.tag }}-cpu" || true
          df -h / | tail -1

      - name: Build GPU image
        if: contains(inputs.variants, 'gpu')
        run: |
          docker build -t ezpdf-pyserver:gpu -t "ezpdf-pyserver:${{ steps.vars.outputs.tag }}-gpu" \
            --build-arg VARIANT=gpu pyserver

      # Runner has no GPU: confirm CUDA torch + triton import and run inference in CPU fallback.
      # NOTE: triton JIT only runs on the CUDA path, so this cannot prove build-essential is needed —
      # dropping it from the Dockerfile breaks GPU inference at runtime only.
      - name: Smoke test GPU image
        if: contains(inputs.variants, 'gpu')
        run: |
          set -euo pipefail
          docker run --rm ezpdf-pyserver:gpu \
            python -c "import torch, triton; print('torch', torch.__version__, '| cuda build', torch.version.cuda, '| triton', triton.__version__)"
          docker run --rm -v "$PWD/scripts/smoke-inference.py:/smoke.py:ro" ezpdf-pyserver:gpu python /smoke.py

      - name: Package and upload GPU snapshot
        if: contains(inputs.variants, 'gpu')
        run: bash scripts/docker-snapshot.sh gpu "${{ steps.vars.outputs.tag }}" "${{ steps.vars.outputs.release }}"

      - name: Summary
        if: always()
        run: |
          df -h / | tail -1
          gh release view "${{ steps.vars.outputs.release }}" --json assets \
            -q '.assets[] | "\(.name)\t\(.size)"' || true
