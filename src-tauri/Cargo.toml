[package]
name = "ezpdf"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ezpdf_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2.7.3"
ts-rs = "12.0.1"
# 仅访问 127.0.0.1 的 pyserver（/health 轮询 + 阶段4 OCR 调用），无需 TLS
reqwest = { version = "0.12", default-features = false, features = ["json"] }
# pyserver 生命周期：子进程管道读写 / watch 停止信号 / 超时（与 tauri 共用同版本 tokio）
tokio = { version = "1", features = ["process", "io-util", "macros", "sync", "time"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
